# Workflow de release de distribuição (issue #363)
# Disparado no fechamento de release: push de tag anotada (rito dev -> tags -> main).
# Gera sdist + wheel e publica a GitHub Release da tag com os artefatos anexados.

name: Release distribution

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Build distributions
        run: uv build

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Release ${{ github.ref_name }} — artefatos de distribuição (sdist e wheel) gerados por CI." \
            dist/*
