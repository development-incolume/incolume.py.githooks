# Publish the project documentation site via mkdocs gh-deploy.
# Issue #352 — triggers: manual (workflow_dispatch) or tag push (release).

name: Docs site

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to publish from (default: dev)'
        required: false
        default: 'dev'
  push:
    tags: ['*']

permissions:
  contents: write

concurrency:
  group: docs-site-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Install dependencies
        run: uv sync --all-packages --all-extras --all-groups --locked --python 3.10

      - name: Build and deploy docs
        run: uv run --python 3.10 mkdocs gh-deploy --force
