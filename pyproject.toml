[project]
name = "incolume-py-githooks"
version = "1.28.0a3"
description = "plugin `pre-commit` with Hooks git for incolume projects"
readme = "README.md"
license-files = ["LICEN[CS]E*", "docs/vendored/licenses/*.txt", "docs/AUTHORS.md"]
requires-python = ">=3.11, <4"
keywords = ["githooks", "development", "python modules", "utilities", "build tools"]
authors = [
  {name="britodfbr", email =  "contato@incolume.com.br"}
]

maintainers = [
  {name="britodfbr", email =  "contato@incolume.com.br"}
]

classifiers = [
  'Development Status :: 5 - Production/Stable',
  'Operating System :: OS Independent',
  'Natural Language :: Portuguese (Brazilian)',
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Software Development :: Build Tools",
  'Topic :: Software Development :: Libraries :: Python Modules',
  'Topic :: Utilities',
]

dependencies = [
    "click>=8.5.1",
    "colorama>=0.4.6",
    "deprecated>=3.0.1 ; python_full_version >= '3.12'",
    "deprecated>=1.3.1 ; python_full_version < '3.12'",
    "icecream>=2.2.0",
    "tomli>=2.5.0 ; python_full_version < '3.11'",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "incolume-py-changelog>=1.10.0",
    "mypy>=2.4.1",
    "pre-commit==4.6.0",
    "pyyaml>=6.0.3",
    "pytest>=9.2.0",
    "pytest-click>=2.0.0",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.7.1",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.6",
    "ty>=0.0.107",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocs-static-i18n>=1.3.1",
    "mkdocstrings>=1.0.6",
    "mkdocstrings-python>=2.0.9",
]

[project.optional-dependencies]
jupyter = [
    "notebook>=7.6.5",
]
cli = [
  "rich>=15.0.0",
  "click>=8.5.1",
]
all = ["notebook", "rich", "click"]

[project.scripts]
check-commit-footer = "incolume.py.githooks.cli:check_commit_footer_cli"
check-len-first-line = "incolume.py.githooks.cli:check_len_first_line_commit_msg_cli"
check-manual-changelog = "incolume.py.githooks.cli:check_manual_changelog_cli"
check-manual-version = "incolume.py.githooks.cli:check_manual_version_cli"
check-type-commit-msg = "incolume.py.githooks.cli:check_type_commit_msg_cli"
check-type-from-status = "incolume.py.githooks.cli:check_type_from_status_cli"
clean-commit-msg = "incolume.py.githooks.cli:clean_commit_msg_cli"
detect-key = "incolume.py.githooks.cli:detect_private_key_cli"
effort-msg = "incolume.py.githooks.cli:effort_msg_cli"
effort-random-msg = "incolume.py.githooks.cli:effort_random_msg_cli"
githooks-cli = "incolume.py.githooks.cli:cli_group"
insert-diff-commit = "incolume.py.githooks.cli:insert_diff_cli"
is-precommit-installed = "incolume.py.githooks.cli:pre_commit_installed_cli"
is-valid-branchname = "incolume.py.githooks.cli:check_valid_branchname_cli"
is-valid-filename = "incolume.py.githooks.cli:check_valid_filenames_cli"
is-valid-msg-commit = "incolume.py.githooks.cli:validate_format_commit_msg_cli"
set-footer-signed-off-by = "incolume.py.githooks.cli:footer_signedoffby_cli"
set-issue-from-branch = "incolume.py.githooks.cli:set_issue_from_branch_cli"
set-type-from-status = "incolume.py.githooks.cli:set_type_from_status_cli"

[project.gui-scripts]
spam-gui = "incolume.py.githooks.gui.main:run"

[project.urls]
Homepage = "https://development-incolume.github.io/incolume.py.githooks/"
Documentation = "https://development-incolume.github.io/incolume.py.githooks/"

[tool.uv]
allow-insecure-host = ["https://github.com", "https://gitlab.com"]

[tool.uv.build-backend]
module-root = ""
module-name = "incolume.py.githooks"

[tool.uv.sources]

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"
